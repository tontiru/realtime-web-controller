<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Unity WebGL | BSG</title>

  <link rel="stylesheet" href="TemplateData/style.css" />
  <link rel="shortcut icon" href="TemplateData/favicon.ico" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #unity-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: black;
    }

    /* Fixed visual size, Unity controls render size */
    #unity-canvas {
      width: 960px;
      height: 600px;
      background: black;
      display: block;
    }

    #unity-loading-bar {
      position: absolute;
      width: 300px;
      bottom: 20px;
    }

    #unity-progress-bar-empty {
      width: 100%;
      height: 10px;
      background: #222;
    }

    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      background: #f4c430;
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
  </div>

  <script>
    const container = document.getElementById("unity-container");
    const canvas = document.getElementById("unity-canvas");
    const loadingBar = document.getElementById("unity-loading-bar");
    const progressBarFull = document.getElementById("unity-progress-bar-full");

    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/WebSocketTest.loader.js";

    const config = {
      dataUrl: buildUrl + "/WebSocketTest.data",
      frameworkUrl: buildUrl + "/WebSocketTest.framework.js",
      codeUrl: buildUrl + "/WebSocketTest.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "BSG",
      productVersion: "0.1.0",

      /* CRITICAL STABILITY SETTINGS */
      devicePixelRatio: 1,
      matchWebGLToCanvasSize: true,
    };

    loadingBar.style.display = "block";

    const script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = () => {
      createUnityInstance(
        canvas,
        config,
        (progress) => {
          progressBarFull.style.width = (progress * 100) + "%";
        }
      ).then((unityInstance) => {
        loadingBar.style.display = "none";

        // Expose for host / iframe parent
        window.unityInstance = unityInstance;

        // Notify host that Unity is ready
        try {
          const target = window.parent && window.parent !== window
            ? window.parent
            : window;

          target.postMessage({ type: "UNITY_READY" }, "*");
        } catch (e) {
          console.warn("UNITY_READY postMessage failed:", e);
        }

        console.log("Unity loaded and ready");

        // Receive controller / host messages
        window.addEventListener("message", (event) => {
          if (!event.data) return;

          if (event.data.type === "unity-event" || event.data.action) {
            try {
              unityInstance.SendMessage(
                "WebGLBridge",
                "OnControllerEvent",
                JSON.stringify(event.data)
              );
            } catch (e) {
              console.error("SendMessage failed:", e);
            }
          }
        });
      }).catch((err) => {
        console.error("Unity failed to load:", err);
      });
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
